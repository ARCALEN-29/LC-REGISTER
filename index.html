<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | LC Academy</title>
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Quattrocento:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="splash.css">
</head>
<body>

    <div id="app-splash" class="app-splash" role="status" aria-live="polite">
        <div class="splash-orb splash-orb--one"></div>
        <div class="splash-orb splash-orb--two"></div>
        <div class="splash-card">
            <img class="splash-emblem" src="logo.png" alt="LC Academy">
            <span class="splash-eyebrow">BIENVENIDO A</span>
            <h1>LC Academy</h1>
            <p>Excelencia, conocimiento y futuro.</p>
            <div class="splash-progress" aria-hidden="true"><span></span></div>
            <span class="splash-status">Preparando tu espacio</span>
        </div>
    </div>

    <!-- MODAL DE NOTIFICACIÓN -->
    <div id="modal-notification" class="modal-overlay hidden">
        <div class="modal-card">
            <span id="modal-icon" class="modal-icon">✅</span>
            <h2 id="modal-title" class="modal-title">¡Éxito!</h2>
            <p id="modal-text" class="modal-text">El usuario ha sido registrado correctamente.</p>
            <button id="modal-close-btn" class="btn-premium" onclick="closeModal()">CONTINUAR</button>
        </div>
    </div>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="glass-card-login">
        <div class="text-center">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>Admin Controller</h1>
            <p>Acceso Restringido | LC Academy</p>
        </div>

        <form id="admin-login-form" class="space-y-4" autocomplete="on">
            <div class="input-group">
                <label for="admin-email" class="label-premium">Correo Electrónico</label>
                <input type="email" id="admin-email" name="username" class="input-premium" placeholder="admin@lc-academy.com" autocomplete="username" required>
            </div>
            <div class="input-group">
                <label for="admin-pass" class="label-premium">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="admin-pass" name="password" class="input-premium" placeholder="••••••••" autocomplete="current-password" required>
                    <span class="toggle-password" onclick="togglePass('admin-pass', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>
            <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>
            <button id="login-btn" type="submit" class="btn-premium mt-4">INGRESAR AL SISTEMA</button>
        </form>
    </div>


    <script>
        (() => {
            const splash = document.getElementById('app-splash');
            if (!splash) return;
    
            const minimumDuration = 3000; // 3 segundos visibles
            const fadeOutDuration = 500;  // 0.5 segundos para la animación de salida
    
            window.setTimeout(() => {
                splash.classList.add('app-splash--leaving');
    
                window.setTimeout(() => {
                    splash.hidden = true;
                    document.body.classList.add('app-ready');
                }, fadeOutDuration);
            }, minimumDuration);
        })();
    </script>
    
    <script type="module" src="script.js"></script>

    <!-- LÓGICA JAVASCRIPT BASE -->
    <script>

        function togglePass(inputId, iconEl) {
            const input = document.getElementById(inputId);
            const icon = iconEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function logout() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function navigateToRole(url) {
            window.location.href = url;
        }

        function closeModal() {
            document.getElementById('modal-notification').classList.add('hidden');
        }
    </script>
</body>
</html>
