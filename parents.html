<div class="mb-1">
    <label class="label-premium">Nombre Completo</label>
    <input type="text" id="userName" class="input-premium" required>
</div>
<div class="mb-1">
    <label class="label-premium">Email</label>
    <input type="email" id="userEmail" class="input-premium" required>
</div>
<div class="mb-1">
    <label class="label-premium">Contraseña Generada</label>
    <div class="password-wrapper">
        <input type="text" id="userGeneratedPass" class="input-premium" readonly>
        <span class="toggle-password" onclick="togglePass('userGeneratedPass', this)">
            <i class="fas fa-eye"></i>
        </span>
    </div>
    <button type="button" id="gen-pass-btn" class="btn-premium" style="margin-top: 10px; padding: 10px; font-size: 12px;">GENERAR CONTRASEÑA SEGURA (16 CARACTERES)</button>
</div>
<div class="mb-1 search-container">
    <label class="label-premium" for="studentSearch">Buscar Estudiante</label>
    <div class="input-with-icon">
        <input type="text" id="studentSearch" class="input-premium" placeholder="Escribe el nombre de tu hijo..." autocomplete="off">
        <!-- Ícono de lupa opcional (puedes usar un SVG o FontAwesome) -->
        <span class="search-icon">🔍</span>
    </div>
</div>
